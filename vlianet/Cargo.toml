[package]
name = "vlianet"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
libp2p = { version = "0.54", features = [
    "tokio",
    "gossipsub",
    "kad",
    "noise",
    "tcp",
    "quic",
    "yamux",
    "macros",
    "serde",
    "identify",
    "ping",
    "autonat"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
tokio-util = { version = "0.7", features = ["codec"] }